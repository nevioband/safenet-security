  <h1>Tastatur-Demo</h1>
  <p>Klicke ins Eingabefeld und drücke Tasten.</p>

  <input id="eingabe" type="text" placeholder="Hier tippen">
  <p id="ausgabe">Noch keine Taste erkannt.</p>

  <script>
    const eingabe = document.getElementById("eingabe");
    const ausgabe = document.getElementById("ausgabe");

    eingabe.addEventListener("keydown", (event) => {
      ausgabe.textContent = `Gedrückte Taste: ${event.key}`;
    });
  </script>
